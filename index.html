<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Shipment Inspection Dashboard</title>
    <link rel="stylesheet" href="assets/styles/style.css">
</head>

<body>
    <header class="top">
        <div>
            <h1>Shipment Inspection Dashboard</h1>
            <p class="muted">Local, runs in your browser. Place Excel files in <code>/data</code> or upload manually.
            </p>
        </div>
        <div class="actions">
            <label class="btn"><input id="fileInput" type="file" accept=".xlsx,.xls,.csv" multiple /> Upload
                file(s)</label>
            <!-- Load default removed -->
            <button id="exportCsv" class="btn">Export Current (Excel)</button>
        </div>
    </header>

    <main class="container">
        <section class="controls card">
            <div class="filters">
                <label>Factory
                    <select id="factoryFilter">
                        <option value="all">All</option>
                    </select>
                </label>

                <label>Container
                    <select id="containerFilter">
                        <option value="all">All</option>
                    </select>
                </label>

                <label>Status
                    <select id="statusFilter">
                        <option value="all">All</option>
                        <option value="Finished">Finished</option>
                        <option value="In Progress">In Progress</option>
                        <option value="Not Started">Not Started</option>
                        <option value="Remaining">Remaining</option>
                    </select>
                </label>

                <label class="search">Search
                    <input id="searchInput" placeholder="search box number, product, etc" />
                </label>

                <div class="rows">Rows: <span id="rowsCount">0</span></div>
            </div>

            <!-- New small cards for multipack / normal -->
            <div class="summary" id="summaryWrap"></div>

            <div style="display:flex;gap:10px;margin-top:10px;align-items:center">
                <div class="card small-stat" id="multipackCard" style="cursor:pointer">
                    <strong>Multi-pack boxes</strong>
                    <div id="multipackCount" class="big">0</div>
                    <div class="muted">ItemCount > 1 (click to filter)</div>
                </div>

                <div class="card small-stat" id="normalPackCard" style="cursor:pointer">
                    <strong>Normal boxes</strong>
                    <div id="normalCount" class="big">0</div>
                    <div class="muted">ItemCount = 1 (click to filter)</div>
                </div>
            </div>

        </section>

        <section id="table-wrap" class="card">
            <table id="dataTable">
                <thead id="tableHead"></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </section>

        <section class="cards">
            <div class="card">
                <canvas id="progressChart" height="220"></canvas>
            </div>
            <div class="card">
                <canvas id="boxesByContainerChart" height="220"></canvas>
            </div>
        </section>
    </main>

    <!-- Libraries (CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- App script -->
    <script src="assets/scripts/app.js"></script>
    <script type="module">
  // Import the functions you need from the SDKs you need
  import { initializeApp } from "https://www.gstatic.com/firebasejs/12.6.0/firebase-app.js";
  // TODO: Add SDKs for Firebase products that you want to use
  // https://firebase.google.com/docs/web/setup#available-libraries

  // Your web app's Firebase configuration
  const firebaseConfig = {
    apiKey: "AIzaSyBB8d4IJT4pDMhbv5IZZk6L31hj5_1VG4Q",
    authDomain: "inspection-dashboard-396df.firebaseapp.com",
    projectId: "inspection-dashboard-396df",
    storageBucket: "inspection-dashboard-396df.firebasestorage.app",
    messagingSenderId: "492228000420",
    appId: "1:492228000420:web:167be5b9abf95273db8431"
  };

  // Initialize Firebase
  const app = initializeApp(firebaseConfig);
</script>
</body>


</html>
